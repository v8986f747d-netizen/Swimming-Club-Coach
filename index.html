<html lang="ja">
<head>

<title>プールサイドの監督</title>

<style>
:root{--deep:#0B3A4A;--deep2:#0F4C60;--water:#E8F3F2;--surface:#FFFFFF;--ink:#14262C;--ink2:#4B6168;--line:#C5DCDC;--yellow:#F4B400;--red:#C8443E;--blue:#2F7FB8;--green:#2E8B6A;--board:#071E26;--boardtxt:#FFD24A;
 --r-G:#9AA5A8;--r-F:#86A39C;--r-E:#5FA58D;--r-D:#3E9DB3;--r-C:#3479C0;--r-B:#5865D4;--r-A:#8F52D0;--r-S:#D0563A;--r-SS:#E08A12;--r-SSS:#B8921C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--water:#0C1E24;--surface:#12303A;--ink:#E3F0F0;--ink2:#9DB7BC;--line:#24505C;--deep:#06232D;--deep2:#0A3442;--board:#031319;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--water);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
h1{font-size:28px;line-height:1.25;margin:0 0 8px;letter-spacing:.02em}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:15px;margin:14px 0 6px}
p{margin:6px 0}
.mut{color:var(--ink2);font-size:13px}
.board{background:var(--board);color:#fff;border-radius:0 0 14px 14px;margin:0 -14px 12px;padding:12px 18px 14px;position:sticky;top:0;z-index:5}
.board .date{font-size:24px;font-weight:800;color:var(--boardtxt);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.board .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:#cfe3e6;margin-top:2px}
.kind{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#08222b;background:#9fd6d9}
.kind.k-大会{background:var(--yellow)}.kind.k-試験期間{background:#f3a59f}.kind.k-オフ日{background:#c9d4d6}.kind.k-夏休み,.kind.k-冬休み,.kind.k-春休み{background:#a7e0b8}.kind.k-土曜,.kind.k-祝日{background:#bcd6ff}.kind.k-冬合宿{background:#ffd0a0}
.rk{display:inline-flex;min-width:30px;justify-content:center;padding:0 6px;border-radius:6px;font-weight:800;color:#fff;font-size:13px;line-height:22px}
.rk.G{background:var(--r-G)}.rk.F{background:var(--r-F)}.rk.E{background:var(--r-E)}.rk.D{background:var(--r-D)}.rk.C{background:var(--r-C)}.rk.B{background:var(--r-B)}.rk.A{background:var(--r-A)}.rk.S{background:var(--r-S)}.rk.SS{background:var(--r-SS)}.rk.SSS{background:linear-gradient(135deg,#B8921C,#F2D266,#B8921C)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.panel.hot{border:2px solid var(--yellow)}
.menus{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:72px}
.mbtn b{display:block;font-size:15px}
.mbtn small{display:block;color:var(--ink2);font-size:12px;line-height:1.4}
.mbtn.on{border-color:var(--deep2);background:linear-gradient(0deg,rgba(47,127,184,.10),rgba(47,127,184,.10)),var(--surface);box-shadow:inset 0 0 0 1px var(--deep2)}
.mbtn:disabled{opacity:.45;cursor:not-allowed}
.mbtn .tag{display:block;font-size:11px;color:var(--ink2);line-height:1.3}
.cta{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.cta button{pointer-events:auto;width:100%;max-width:532px;background:var(--yellow);color:#20180a;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:800;box-shadow:0 3px 0 #b88400}
.cta button:active{transform:translateY(2px);box-shadow:0 1px 0 #b88400}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--deep);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs div{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;background:none;border:none;color:#9fc3c9;padding:8px 0 10px;font-size:12px;font-weight:700}
nav.tabs button.on{color:#fff;box-shadow:inset 0 3px 0 var(--yellow)}
nav.tabs button span{display:block;font-size:18px;line-height:22px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.prow{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;text-align:left;padding:0}
.prow .nm{font-weight:700}
.prow .meta{color:var(--ink2);font-size:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:11px;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);margin-right:3px}
.pill.warn{border-color:var(--red);color:var(--red)}
.up{color:var(--green)}.down{color:var(--red)}
.notes li{font-size:14px}
.notes li.up::before{content:'▲ ';color:var(--green)}.notes li.down::before{content:'▼ ';color:var(--red)}.notes li.rank::before{content:'★ ';color:var(--yellow)}.notes li.kika{font-weight:800}.notes li.kika::before{content:'✦ ';color:var(--r-SS)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.stats div{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);padding:3px 0}
.arw{font-size:12px;width:22px;text-align:right}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700}
.btn.pri{background:var(--deep2);color:#fff;border-color:var(--deep2)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sheet{position:fixed;inset:0;background:rgba(3,19,25,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--water);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.full{position:fixed;inset:0;background:var(--water);z-index:20;overflow:auto}
.full>div{max-width:560px;margin:0 auto;padding:0 14px 120px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink2);font-weight:700}
.scroll{overflow-x:auto}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.choice b{display:block}
.choice:hover{border-color:var(--deep2)}
.pool{background:#0e6f8a;border-radius:10px;overflow:hidden;position:relative}
canvas{display:block;width:100%}
.lb td{padding:3px 4px}
.lb tr.own{background:rgba(244,180,0,.18);font-weight:700}
.prog li{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.prog li.done{color:var(--ink2)}
.prog li.cur{font-weight:800}
.prog li.maybe::after{content:'予選次第';font-size:10px;border:1px solid var(--line);color:var(--ink2);border-radius:99px;padding:0 6px;margin-left:auto}
.prog li.mine::after{content:'自校';font-size:10px;background:var(--yellow);color:#20180a;border-radius:99px;padding:0 6px;margin-left:auto}
.slot{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:4px 7px;font-size:12px}
.slot select{min-width:0}
.seg button.on{background:var(--deep2);color:#fff}
.title{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 4px}
.title h1{font-size:40px;line-height:1.15;color:var(--deep2)}
@media (prefers-color-scheme:dark){.title h1{color:#9fd6d9}}
.lanes{height:10px;background:repeating-linear-gradient(90deg,#D64545 0 14px,#fff 14px 28px,#2F7FB8 28px 42px,#fff 42px 56px);border-radius:3px;margin:14px 0}
.cards{display:grid;gap:8px}
.card{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.card.on{border-color:var(--deep2)}
select,input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--water);padding:8px 14px;border-radius:10px;z-index:50;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:3px 6px;margin-top:6px}
.mini>span{display:flex;align-items:center;justify-content:space-between;gap:2px;font-size:11px;color:var(--ink2)}
.rk.s{min-width:26px;font-size:11px;line-height:17px;padding:0 3px;border-radius:5px}
</style>
</head>

function holidays(y){
 if(HOL_CACHE[y])return HOL_CACHE[y];
 const H=new Set([ymd(y,1,1),ymd(y,2,11),ymd(y,2,23),ymd(y,4,29),ymd(y,5,3),ymd(y,5,4),ymd(y,5,5),ymd(y,8,11),ymd(y,11,3),ymd(y,11,23),
  nthMon(y,1,2),nthMon(y,7,3),nthMon(y,9,3),nthMon(y,10,2)]);
 const b=y-1980;H.add(ymd(y,3,Math.floor(20.8431+0.242194*b-Math.floor(b/4))));H.add(ymd(y,9,Math.floor(23.2488+0.242194*b-Math.floor(b/4))));
 const list=[...H].sort();
 for(const h of list){if(dow(h)===0){let n=addD(h,1);while(H.has(n))n=addD(n,1);H.add(n);}}
 for(const h of [...H]){const n2=addD(h,2);if(H.has(n2)&&!H.has(addD(h,1))&&dow(addD(h,1))!==0)H.add(addD(h,1));}

}

/* ===== 学校の名簿（固定シードで毎回同じ） ===== */
function buildSchools(){
 const rnd=mulberry(20250401);const out=[];let id=0;
 const pk=a=>a[Math.floor(rnd()*a.length)];
 for(const P of PREFS){
  const pre=P.name==='東京都'?'都立':P.name==='北海道'?'道立':(P.name==='大阪府'||P.name==='京都府')?'府立':'県立';
  const used=new Set();const n=P.n;
  const tiers=[];const share=[.20,.33,.30,.12,.05];
  const cnt=share.map(s=>Math.floor(s*n));let rest=n-cnt.reduce((a,b)=>a+b,0);
  if(n>=8&&cnt[4]===0){cnt[4]=1;rest--;}
  if(n>=6&&cnt[3]===0&&rest>0){cnt[3]=1;rest--;}
  cnt[2]+=rest;if(cnt[2]<0){cnt[1]+=cnt[2];cnt[2]=0;}
  cnt.forEach((c,t)=>{for(let i=0;i<c;i++)tiers.push(t);});
  for(let i=tiers.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[tiers[i],tiers[j]]=[tiers[j],tiers[i]];}
  for(let i=0;i<n;i++){
   const t=tiers[i];const priv=rnd()<(t===4?.6:.25);let name,guard=0;
   do{const pl=pk(P.places);
    if(priv){name=pl+pk(['学園','学院','大学附属','国際','学園','学院'])+'高校';}
    else{const r=rnd();name=pre+pl+(r<.4?'':r<.75?pk(['北','南','東','西','中央']):pk(['工業','商業','農業','総合']))+'高校';}
    guard++;if(guard>50)name=(priv?'':pre)+pl+'第'+(i+1)+'高校';
   }while(used.has(name));
   used.add(name);
   const lo=[1,21,41,61,81][t];const kaku=lo+Math.floor(rnd()*20);
   out.push({id:id++,name,pref:P.id,kaku,tier0:t,priv});
  }
 }
 return out;
}

 if(course==='SC'){w.tn*=2;const t=Object.values(w).reduce((a,b)=>a+b,0);for(const k in w)w[k]/=t;}
 const v=w.spd*p.s.spd+w.end*p.s.end+w.pow*p.s.pow+w.tech*techOf(p,str)+w.st*p.s.st+w.tn*p.s.tn;
 return v/150;
}
function tOf(ev,x,course){
 const [,,lim]=EV[baseEv(ev)];const beg=lim*1.45;
 let t=x<=1?beg-(beg-lim)*(1-Math.pow(Math.max(0,1-x),1.4)):lim*(1-0.045*(x-1));
 if(course==='SC'&&baseEv(ev)!=='100IM')t*=0.975;return t;
}

 const [,,lim]=EV[baseEv(ev)];const beg=lim*1.45;
 if(course==='SC'&&baseEv(ev)!=='100IM')t/=0.975;
 if(t>=lim){const f=clamp((beg-t)/(beg-lim),0,1);return 1-Math.pow(1-f,1/1.4);}
 return 1+(1-t/lim)/0.045;
}

 const vac=Y.vac.find(v=>s>=v[0]&&s<=v[1])||null;
 const camp=G.campBooked&&s>=Y.camp&&s<=addD(Y.camp,6);
 let practice=[1,2,3,5,6].includes(d);if(camp)practice=true;
 let mult=1,kind='平日';
 if(d===6||hol){mult=1.5;kind=hol?'祝日':'土曜';}
 if(vac){mult=1.5;kind=vac[2];}
 if(exam){mult=.5;kind='試験期間';}
 if(meet){practice=false;kind='大会';}

function practice(menuKey){

   let d=gains[k]*eff;if(STROKES.includes(k))d*=APT_MUL[p.apt[k]];
   d*=Math.max(.05,1-Math.pow(p.s[k]/p.cap[k],2));
   p.s[k]=Math.min(p.cap[k],p.s[k]+d);
  }

function runExam(ex){
 let red=0;
 for(const p of G.own.filter(active)){
  const sub=[0,1,2,3,4].map(()=>clamp(Math.round(p.gak+gauss()*10+G.studyBonus),0,100));const tot=sub.reduce((a,b)=>a+b,0);

  if(sub.some(v=>v<30)){p.mor-=10;p.hoshu=2;red++;}
  p.mor=clamp(p.mor,0,100);

}

const TIMED_EV=['400IM','1500Fr','100IM'];
const LANES=[4,5,3,6,2,7,1,8];
function isTimed(def,ev){return def.timed||TIMED_EV.includes(baseEv(ev))||ev==='R800FR';}
function bestOf(p,course,ev){return p.best&&p.best[course]&&p.best[course][ev];}
function setBest(p,course,ev,t,MR){
 p.best=p.best||{};p.best[course]=p.best[course]||{};const old=p.best[course][ev];
 if(old==null||t<old){p.best[course][ev]=t;if(MR&&!p.other){MR.pb.add(p.id);if(old!=null)MR.log.push(`自己ベスト：${p.nm} ${evName(ev)} ${fmtT(t)}`);}
  if(!p.other){G.records[course]=G.records[course]||{};const r=G.records[course][ev];if(!r||t<r.t)G.records[course][ev]={t,nm:p.nm,fy:G.fy,meet:MR?MR.def.ja:''};
   const lim=tOf(ev,1,course);const key=ev+course;G.hs=G.hs||{};if(t<lim&&!G.hs[key]){G.hs[key]=1;addKaku(mySchool(),10,'高校記録の更新');}}
  return true;}
 return false;
}
function taperOf(sat){const from=addD(sat,-14);const n=G.mtgDays.filter(d=>d>=from&&d<sat).length;return n>=7?-.015:n>=4?-.01:n>=1?-.005:0;}
function raceTime(p,ev,ctx){
 const be=baseEv(ev);const [str]=EV[be];
 let cond=[-.01,-.005,0,.007,.015][p.cond??2];if(ctx.talk==='calm')cond/=2;
 let men=Math.min(p.s.men,150);
 if(!p.other){if(p.pers==='負けず嫌い'&&ctx.g>=2)men+=22;if(p.pers==='繊細'&&ctx.g>=1)men-=15;
  if(ctx.talk==='cheer')men+=(p.pers==='真面目'||p.pers==='繊細')?30:15;
  if(ctx.talk==='trust'&&(p.pers==='負けず嫌い'||p.pers==='マイペース'))men+=22;}
 const mental=ctx.g*(75-Math.min(men,150))/75*.004;
 const sw=(ctx.swims||0)*.002;const tp=p.other?0:(ctx.taper||0);
 const nz=gauss()*.004*((p.pers==='気分屋'&&ctx.talk==='calm')?.5:1);
 const t=tOf(be,xOf(p,be,ctx.course),ctx.course)*(1+cond+mental+tp+sw+nz);
 let dq=null;const st=.003+(ctx.g>=2?(150-Math.min(p.s.men,150))/150*.005:0);
 if(!ctx.noStart&&R()<st)dq='フライング';
 if(!dq&&(str==='br'||str==='fl'||str==='im')){const tv=str==='im'?Math.min(p.s.br,p.s.fl):p.s[str];const pr=tv<45?.03:tv<75?.01:.002;if(R()<pr)dq='泳法違反';}
 return {t,dq};
}
function splitsFor(t,dist,L,end){
 const n=Math.max(1,Math.round(dist/L));const f=.02+.04*(1-Math.min(end,150)/150);
 const w=[];for(let k=0;k<n;k++)w.push(k===0?(n===1?1:.94):1+f*(n<=2?1:(k-1)/(n-2)));
 const tot=w.reduce((a,b)=>a+b,0);let c=0;return w.map(x=>c+=t*x/tot);
}

/* 仮タイムの出場枠 */
function vIndiv(sch,ev,nEv,course){
 const mem=membersOf(sch);const e=Math.min(3,mem*2/nEv);let cnt=Math.floor(e)+(R()<e-Math.floor(e)?1:0);const out=[];
 for(let k=0;k<cnt;k++){const s=sch.kaku+gauss()*12-5*k;const et=tOf(ev,xFromS(s),course);out.push({sid:sch.id,s,et});}
 return out;
}
function vRelay(sch,rv,course){if(membersOf(sch)<8)return null;const s=sch.kaku+gauss()*8;return {sid:sch.id,s,et:relayVT(rv,xFromS(s),course)};}
const vT=r=>r.et*(1+gauss()*.004);

/* 他校の選手を決勝・自校の組のために用意（保存選手を優先） */
function getOther(sid,ev,xT,course,used){
 const list=G.others[sid]=G.others[sid]||[];
 const c=list.find(p=>!used.has(p.id)&&(used.cnt[p.id]||0)<2&&Math.abs(xOf(p,ev,course)-xT)<=.03);
 if(c){used.add(c.id);used.cnt[c.id]=(used.cnt[c.id]||0)+1;return c;}
 const sch=G.schools[sid];const p=genOther(sid,sch.kaku,ev,xT,course,PREFS[sch.pref].name==='沖縄県',null);
 list.push(p);used.add(p.id);used.cnt[p.id]=1;return p;
}

function eligibleOwn(def){return G.own.filter(p=>active(p)&&p.inj===0&&(!def.newbie||p.g<=2));}
function autoEntries(def,players,course){
 const evs=def.ev;const pairs=[];
 for(const p of players)for(const ev of evs)pairs.push({p,ev,x:xOf(p,ev,course)});
 pairs.sort((a,b)=>b.x-a.x);const per={},perEv={},out={};
 for(const q of pairs){if((per[q.p.id]||0)>=2)continue;if(!def.rec&&(perEv[q.ev]||0)>=3)continue;
  per[q.p.id]=(per[q.p.id]||0)+1;perEv[q.ev]=(perEv[q.ev]||0)+1;(out[q.ev]=out[q.ev]||[]).push(q.p.id);}
 return out;
}

  for(const ev of def.ev)MR.virt[ev]=(Q.v[ev]||[]).filter(r=>def.scope==='nat'||PREFS[G.schools[r.sid].pref].block===block).map(r=>({...r}));
  for(const rv of def.rl){MR.vR[rv]=(Q.v[rv]||[]).filter(r=>def.scope==='nat'||PREFS[G.schools[r.sid].pref].block===block).map(r=>({...r}));if(Q.ownR.includes(rv))MR.ownR[rv]=null;}
 }else if(def.scope==='jo'){
  const players=G.own.filter(p=>active(p)&&p.inj===0);
  for(const p of players){const ok=def.ev.filter(ev=>{const b=bestOf(p,course,ev);return b&&b<=joStd(ev,course);}).sort((a,b)=>xOf(p,b,course)-xOf(p,a,course)).slice(0,4);
   for(const ev of ok)(MR.own[ev]=MR.own[ev]||[]).push(p.id);}
  for(const ev of def.ev){const std=joStd(ev,course);MR.virt[ev]=[];
   for(const s of G.schools){if(s.own||s.kaku<45)continue;for(const r of vIndiv(s,ev,def.ev.length,course))if(r.et<=std)MR.virt[ev].push(r);}}
  const swimmers=new Set(Object.values(MR.own).flat());
  for(const rv of def.rl){const std=joStd(rv,course);MR.vR[rv]=G.schools.filter(s=>!s.own&&s.kaku>=55).map(s=>vRelay(s,rv,course)).filter(r=>r&&r.et<=std);if(swimmers.size>=4)MR.ownR[rv]=null;}
 }else if(def.scope==='ks'){

  for(const ev of def.ev){MR.virt[ev]=reps.map(s=>({sid:s.id,s:88+gauss()*8,et:0}));MR.virt[ev].forEach(r=>r.et=tOf(ev,xFromS(r.s),course));}
 }
 const has=new Set([...def.ev,...def.rl]);

  if(def.scope==='ks'){for(const c of ['A','B']){const k2=c+'|'+ev;if(has.has(k2))MR.items.push({ev:k2,ph:isTimed(def,ev)?'t':ph,day});}continue;}
  if(!has.has(ev))continue;const tm=isTimed(def,ev);if(tm&&ph==='f')continue;MR.items.push({ev,ph:tm?'t':ph,day});}};
 mk(ORDER1,1);mk(ORDER2,2);
 MR.ownAny=Object.keys(MR.own).some(e=>MR.own[e].length)||Object.keys(MR.ownR).length>0;
 for(const ev in MR.own)for(const pid of MR.own[ev])MR.swims[pid]={1:0,2:0};

}
function itemOwn(MR,it){const ev=it.ev;if(ev[0]==='R')return it.ph==='f'?(MR.pre[ev]||[]).slice(0,8).some(r=>r.own):MR.ownR[ev]!==undefined&&MR.ownR[ev]!==false;
 if(it.ph==='f')return (MR.fin8&&MR.fin8[ev]||[]).some(r=>r.own);return (MR.own[ev]||[]).length>0;}
function needTalk(MR,it){return it.ph==='f'&&itemOwn(MR,it)&&MR.def.g>=1;}
function ctxOf(MR,it,talk){return {g:MR.def.g,course:MR.course,talk,taper:taperOf(MR.sat)};}
function ownRow(MR,p,ev,it,talk){const c=ctxOf(MR,it,talk);c.swims=MR.swims[p.id]?MR.swims[p.id][it.day]:0;const r=raceTime(p,ev,c);if(MR.swims[p.id])MR.swims[p.id][it.day]++;
 return {sid:G.sid,pid:p.id,own:true,nm:p.nm,t:r.t,dq:r.dq,end:p.s.end,et:bestOf(p,MR.course,ev)||tOf(ev,xOf(p,ev,MR.course),MR.course)};}
function sortRows(rows){rows.sort((a,b)=>(a.dq?1:0)-(b.dq?1:0)||a.t-b.t);rows.forEach((r,i)=>r.rk=r.dq?null:i+1);return rows;}
function laneRows(rows8){return rows8.map((r,i)=>({...r,lane:LANES[i]}));}
function genRow(MR,r,ev,it){

function animOf(MR,ev,rows,title){

  if(ev[0]==='R'){let sp=[];let acc=0;const legs=RELAY[ev].legs;(r.legs||[]).forEach((lg,i)=>{const d=EV[legs[i]][1];const s=splitsFor(lg.t,d,L,lg.end);sp=sp.concat(s.map(v=>v+acc));acc+=lg.t;});
   if(!sp.length)sp=splitsFor(r.t,EV[legs[0]][1]*4,L,100);return {lane:r.lane,nm:r.nm,sch:G.schools[r.sid].name,own:!!r.own,t:r.t,dq:r.dq,sp,legsNm:(r.legs||[]).map(l=>l.nm)};}

/* リレー：チームの泳ぎ */
function relayRun(MR,rv,team,it,talk,isOwn){
 const legs=RELAY[rv].legs;const res=[];let t=0,dq=null;
 team.ps.forEach((p,i)=>{const c=ctxOf(MR,it,talk);c.noStart=i>0;if(isOwn&&MR.swims[p.id])c.swims=MR.swims[p.id][it.day];
  const r=raceTime(p,legs[i],c);if(isOwn&&MR.swims[p.id])MR.swims[p.id][it.day]++;
  let lt=r.t;if(i>0){const pol=(team.pol&&team.pol[i])||'std';lt-=legTO(p)+(pol==='atk'?.2:pol==='safe'?-.2:0);if(R()<(pol==='atk'?.03:pol==='std'?.005:0))dq=dq||'引き継ぎ違反';}
  if(r.dq&&!dq)dq=r.dq;t+=lt;res.push({nm:p.nm,t:lt,end:p.s.end,pid:p.id});});

}
function genTeam(MR,r,rv){const legs=RELAY[rv].legs;const x=xFromS(r.s);if(MR.relGen[r.sid+rv])return MR.relGen[r.sid+rv];
 const ps=legs.map(l=>getOther(r.sid,l,x,MR.course,MR.used));const tm={ps};MR.relGen[r.sid+rv]=tm;return tm;}
function ownTeam(MR,rv){const L=MR.ownR[rv];if(!L)return null;return {ps:L.ids.map(id=>G.own.find(p=>p.id===id)),pol:L.pol};}

/* 1項目を処理 */

  }
 }else{

function relayScore(p,leg,course){const [str,dist]=EV[leg];let s=xOf(p,leg,course);if(p.fav===str)s+=.02;if(favDist(p)===dist)s+=.02;return s;}
function relayCands(MR,rv,legIdx){const leg=RELAY[rv].legs[legIdx];let ps=G.own.filter(p=>active(p)&&p.inj===0&&(!MR.def.newbie||p.g<=2));
 if(MR.def.scope==='jo'){const sw=new Set(Object.values(MR.own).flat());ps=ps.filter(p=>sw.has(p.id));}
 return ps.map(p=>({p,sc:relayScore(p,leg,MR.course)})).sort((a,b)=>b.sc-a.sc);}
function defaultLineups(MR){
 const out={};const cnt={};
 for(const rv of Object.keys(MR.ownR)){
  const legs=RELAY[rv].legs;let ids;
  if(rv==='R400MR'){ids=[];const usedL=new Set();for(let i=0;i<4;i++){const c=relayCands(MR,rv,i).find(c=>!usedL.has(c.p.id)&&(cnt[c.p.id]||0)<2);if(c){ids.push(c.p.id);usedL.add(c.p.id);}}}
  else{const c=relayCands(MR,rv,0).filter(c=>(cnt[c.p.id]||0)<2).slice(0,4).map(c=>c.p);if(c.length===4){const first=c.slice().sort((a,b)=>b.s.st-a.s.st)[0];const rest=c.filter(p=>p!==first);const anchor=rest[0];ids=[first.id,...rest.slice(1).map(p=>p.id),anchor.id];}}
  if(ids&&ids.length===4){ids.forEach(id=>cnt[id]=(cnt[id]||0)+1);out[rv]={ids,pol:['std','std','std','std']};}
 }
 return out;
}

const DB={db:null,
 open(){return new Promise((ok,ng)=>{if(this.db)return ok(this.db);if(typeof indexedDB==='undefined')return ng('no idb');const r=indexedDB.open('swim-coach',1);r.onupgradeneeded=()=>r.result.createObjectStore('save');r.onsuccess=()=>{this.db=r.result;ok(this.db);};r.onerror=()=>ng(r.error);});},
 async put(k,v){const db=await this.open();return new Promise((ok,ng)=>{const t=db.transaction('save','readwrite');t.objectStore('save').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ng(t.error);});},
 async get(k){const db=await this.open();return new Promise((ok,ng)=>{const t=db.transaction('save','readonly');const q=t.objectStore('save').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ng(q.error);});},
 async del(k){const db=await this.open();return new Promise(ok=>{const t=db.transaction('save','readwrite');t.objectStore('save').delete(k);t.oncomplete=()=>ok();});}
};

function animV(){const A=U.anim.data;
 return `<div class="full"><div><header class="board"><div class="date" style="font-size:19px">${esc(A.title)}</div><div class="row"><span>${A.L}mプール</span><span id="adist" class="num" style="color:var(--boardtxt);font-weight:800;font-size:16px"></span><span id="aclock" class="num">0.00</span></div></header>

 <div class="btns">${[[1,'1倍'],[4,'4倍']].map(([v,l])=>`<button class="btn sm ${U.anim.speed===v?'pri':''}" data-act="aspd" data-v="${v}">${l}</button>`).join('')}<button class="btn sm" data-act="askip">結果まで飛ばす</button><button class="btn sm pri" data-act="aclose" id="aclose" style="margin-left:auto;${U.anim.done?'':'display:none'}">次へ</button></div>

let RAF=null;
function startAnim(){
 const A=U.anim.data;const cv=$('#cv');if(!cv)return;const ctx=cv.getContext('2d');
 const W=cv.clientWidth;cv.width=W*devicePixelRatio;cv.height=300*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);
 const H=300,lh=H/8;const maxT=Math.max(...A.lanes.filter(l=>!l.dq).map(l=>l.t),...A.lanes.map(l=>l.t));
 const legsN=A.ev[0]==='R'?4:1;const segPerLeg=A.lanes[0]?A.lanes[0].sp.length/legsN:1;
 const pos=(ln,t)=>{const sp=ln.sp;let k=0;while(k<sp.length&&sp[k]<=t)k++;if(k>=sp.length)return {x:(sp.length%2===1)?1:0,fin:true,seg:sp.length-1,d:sp.length*A.L};
  const a=k?sp[k-1]:0;const f=Math.max(0,(t-a)/(sp[k]-a));return {x:k%2===0?f:1-f,fin:false,seg:k,d:(k+f)*A.L};};
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let last=performance.now();if(reduce)U.anim.t=maxT+1;
 const draw=()=>{
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0e6f8a';ctx.fillRect(0,0,W,H);
  for(let i=0;i<=8;i++){ctx.fillStyle=i%2?'#f4b400':'#d64545';ctx.fillRect(0,i*lh-1,W,2);}
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(W*.5-1,0,2,H);
  const tt=U.anim.t;const fins=[];
  A.lanes.forEach(ln=>{const y=(ln.lane-1)*lh+lh/2;const P=pos(ln,tt);const x=18+P.x*(W-36);
   ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='11px sans-serif';ctx.fillText(String(ln.lane),4,y+4);
   ctx.beginPath();ctx.arc(x,y,ln.own?8:6,0,Math.PI*2);ctx.fillStyle=ln.own?'#F4B400':'#ffffff';ctx.fill();if(ln.own){ctx.strokeStyle='#20180a';ctx.lineWidth=2;ctx.stroke();}
   if(P.fin&&!ln.dq)fins.push(ln);});
  const cl=$('#aclock');if(cl)cl.textContent=fmtT(Math.min(tt,maxT));const lead=Math.max(...A.lanes.map(l=>pos(l,tt).d));const dl=$('#adist');if(dl)dl.textContent=`先頭 ${Math.min(A.dist,Math.floor(lead))}m／${A.dist}m`;
  const sorted=A.lanes.slice().sort((a,b)=>{const pa=pos(a,tt),pb=pos(b,tt);if(pa.fin&&pb.fin)return (a.dq?1:0)-(b.dq?1:0)||a.t-b.t;if(pa.fin)return -1;if(pb.fin)return 1;const da=pa.seg+(pa.seg%2===0?pa.x:1-pa.x),db=pb.seg+(pb.seg%2===0?pb.x:1-pb.x);return db-da;});
  const lb=$('#lb');if(lb)lb.innerHTML=`<tr><th></th><th>コース</th><th>選手</th><th>距離・記録</th></tr>`+sorted.map((ln,i)=>{const P=pos(ln,tt);const fin=P.fin;let nm=ln.nm;if(legsN>1&&ln.legsNm&&ln.legsNm.length){const li=Math.min(3,Math.floor(Math.min(P.seg,ln.sp.length-1)/segPerLeg));nm=`${ln.nm}<br><span class="mut">${esc(ln.legsNm[li]||'')}</span>`;}else nm=`${esc(ln.nm)}<br><span class="mut">${esc(ln.sch)}</span>`;
   return `<tr class="${ln.own?'own':''}"><td>${fin?(ln.dq?'失格':1+A.lanes.filter(o=>!o.dq&&o.t<ln.t).length):''}</td><td>${ln.lane}</td><td>${nm}</td><td class="num">${fin?(ln.dq?'—':fmtT(ln.t)):`<span class="mut">${Math.floor(P.d)}m</span>`}</td></tr>`;}).join('');
  if(tt>=maxT){U.anim.done=true;const b=$('#aclose');if(b)b.style.display='';return;}
  const now=performance.now();const dt=(now-last)/1000;last=now;U.anim.t+=dt*5*U.anim.speed;RAF=requestAnimationFrame(draw);};
 cancelAnimationFrame(RAF);draw();
}

  if(ids.length<4){toast(evName(rv)+'は4人そろえるか、全員外す');return false;}
  if(new Set(ids).size<4){toast(evName(rv)+'に同じ選手が2回入っている');return false;}
  ids.forEach(id=>cnt[id]=(cnt[id]||0)+1);L[rv]={ids:x.ids.slice(),pol:x.pol.slice()};}
 if(Object.values(cnt).some(n=>n>2)){toast('1人が出られるリレーは2種目まで');return false;}
 confirmLineups(R.MR,L);G.relaySel={k:R.k,L};U.relay=null;endDay();await persist();window.scrollTo(0,0);return true;
}

 return `<h2 style="margin-top:0">${S.ja} 終了</h2>${S.team?`<p>学校対抗 <b>${S.team}位</b>（${S.pts}点）</p>`:''}<p>入賞 ${S.top8}件・優勝 ${S.win}件</p>
 ${S.qual?`<p><b>${S.qual}</b></p>`:''}${S.ks?`<p><b>${S.ks}</b></p>`:''}${S.expTxt?`<p>求められる結果（${S.expTxt}）：${S.expOk?'<span class="up">達成</span>':'<span class="down">未達</span>'}</p>`:''}
 <p>格 ${S.kaku0} → <b>${S.kaku1}</b></p>${(S.log||[]).length?`<ul class="list notes">${S.log.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
 ${S.res.length?`<div class="scroll"><table><tr><th>種目</th><th>選手</th><th>順位</th><th>記録</th></tr>${S.res.filter(r=>r.rk||r.dq).map(r=>`<tr><td>${evName(baseEv(r.ev))}</td><td>${esc(r.nm)}</td><td>${r.dq?'失格':r.rk}</td><td class="num">${fmtT(r.t)}</td></tr>`).join('')}</table></div>`:''}`;
}
function exportFile(){const blob=new Blob([packSave()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`swim-coach-${G.date}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function importFile(){const i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{unpackSave(await f.text());await persist();U.screen='game';U.tab='home';toast('読み込んだ');render();}catch(err){toast('読み込めないファイルです');}};i.click();}
